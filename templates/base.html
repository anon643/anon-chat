<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимный чат</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
        header { background: #16213e; padding: 15px 25px; border-radius: 8px; text-align: center; }
        header a { color: #e94560; text-decoration: none; font-weight: bold; }
        main { background: #0f3460; padding: 20px; border-radius: 8px; margin-top: 20px; min-height: 400px; }
        h1 { color: #e94560; }
        button { padding: 12px 30px; background: #e94560; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 18px; }
        button:hover { background: #c73650; }
        button:disabled { background: #555; cursor: wait; }
        input[type=text] { width: 100%; padding: 10px; border: 1px solid #e94560; border-radius: 4px; box-sizing: border-box; background: #16213e; color: #eee; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; max-width: 80%; word-wrap: break-word; }
        .msg.mine { background: #e94560; margin-left: auto; }
        .msg.theirs { background: #16213e; border: 1px solid #e94560; }
        #messages { height: 300px; overflow-y: auto; padding: 10px; background: #0a1a2f; border-radius: 8px; margin-bottom: 10px; }
        .waiting { text-align: center; padding: 40px 0; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #e94560; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <a href="{{ url_for('menu') }}">🎭 Анонимный чат</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
